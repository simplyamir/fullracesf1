
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Full Races: F1 Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 18px;
            background: #101114;
            color: #f5f5f5;
            font-family: system-ui, sans-serif;
        }

        video {
            display: block;
            width: 100%;
            max-height: 70vh;
            background: black;
            border-radius: 10px;
        }

        #status {
            color: #bbb;
            margin: 12px 0;
            overflow-wrap: anywhere;
        }

        button {
            padding: 12px 18px;
            color: white;
            background: #24252b;
            border: 1px solid #45464e;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #33343c;
        }

        #play {
            border-color: #e10600;
        }
    </style>
</head>
<body>
    <h1 style="text-align:center">🏁 Full Races: F1</h1>

    <video id="video" controls playsinline></video>
    <div id="status" role="status">Preparing player...</div>
    <div style="text-align:center">
        <button id="play" type="button">▶️ Play stream</button>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const contentId = params.get("content_id");
        const streamName = params.get("name") || "Selected stream";

        const video = document.getElementById("video");
        const status = document.getElementById("status");
        const playButton = document.getElementById("play");

        const validId = /^[a-f0-9]{40}$/i.test(contentId || "");
        let hls = null;

        function showStatus(message) {
            status.textContent = message;
        }

        function playStream() {
            if (!validId) {
                showStatus(
                    "No valid stream ID. Open this player using a Watch button in Telegram."
                );
                return;
            }

            if (hls) {
                hls.destroy();
                hls = null;
            }

            video.pause();
            video.removeAttribute("src");
            video.load();

            showStatus("Connecting to " + streamName + "…");

            const url =
                "http://127.0.0.1:6878/ace/manifest.m3u8?content_id=" +
                encodeURIComponent(contentId);

            if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = url;
                video.play().catch(() => {
                    showStatus(
                        "Stream selected. Tap Play, or check that Ace Stream Engine is running."
                    );
                });
                return;
            }

            if (window.Hls && Hls.isSupported()) {
                hls = new Hls();

                hls.on(Hls.Events.ERROR, (_event, data) => {
                    if (data.fatal) {
                        showStatus(
                            "Playback failed. Check that Ace Stream Engine is running " +
                            "and that your browser allows access to its local API. " +
                            "Details: " + (data.details || data.type || "unknown error")
                        );
                        hls.destroy();
                        hls = null;
                    }
                });

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    showStatus("Stream loaded: " + streamName);
                    video.play().catch(() => {
                        showStatus(
                            "Stream loaded. Tap Play to begin watching."
                        );
                    });
                });

                hls.loadSource(url);
                hls.attachMedia(video);
                return;
            }

            showStatus("This browser does not support the required HLS playback.");
        }

        playButton.addEventListener("click", playStream);

        if (validId) {
            showStatus("Opening " + streamName + "…");
            playStream();
        } else {
            showStatus(
                "Open this page using a Watch button in your Telegram bot."
            );
        }
    </script>
</body>
</html>
